version: 2

models:
  - name: mart_sales_performance
    description: "Monthly sales performance by category"

    columns:
      - name: order_year
        description: "Year when the order was placed"
        tests:
          - not_null

      - name: order_month
        description: "Month when the order was placed"
        tests:
          - not_null

      - name: category_name
        description: "Product category"
        tests:
          - not_null

      - name: total_revenue
        description: "Total revenue calculated from price, quantity and discount"
        tests:
          - not_null